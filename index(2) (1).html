<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Поисковик по базе автомобилей</title>
<style>
:root{
  --primary:#006fae;
  --primary2:#00558a;
  --gold:#d5a62a;
  --bg:#f4f7fa;
  --card:#ffffff;
  --text:#1c2833;
  --muted:#6c7884;
  --border:#dce4eb;
  --shadow:0 8px 25px rgba(20,45,75,.08);
}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Segoe UI,sans-serif;background:var(--bg);color:var(--text)}
header{
  background:#fff;
  border-bottom:4px solid var(--primary);
  box-shadow:0 3px 14px rgba(0,0,0,.08);
}
.header-inner{max-width:1200px;margin:auto;padding:18px 20px 24px;text-align:center}
.logos{
  display:flex;justify-content:center;align-items:center;gap:28px;
  min-height:125px;margin-bottom:10px
}
.logo-item{
  width:120px;height:120px;display:flex;align-items:center;justify-content:center
}
.logo-item img{max-width:115px;max-height:115px;object-fit:contain}
.department-title{color:#174d70;line-height:1.25}
.small-title{font-size:13px;font-weight:700;letter-spacing:.3px}
.main-title{font-size:20px;font-weight:800;margin-top:4px}
.site-title{
  margin-top:18px;
  color:var(--primary2);
  font-size:27px;font-weight:800;letter-spacing:1px
}
.subtitle{margin:7px 0 0;color:#64717d;font-size:15px}
main{max-width:1200px;margin:28px auto;padding:0 20px}
.panel{background:var(--card);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);padding:22px}
.search-row{display:flex;gap:10px}
.search-row input{flex:1;min-width:0;padding:16px 18px;border:1px solid var(--border);border-radius:10px;font-size:16px;outline:none}
.search-row input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(0,111,174,.1)}
button{border:0;border-radius:10px;padding:0 22px;background:var(--primary);color:white;font-weight:700;cursor:pointer}
button:hover{background:var(--primary2)}
.filters{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}
select{width:100%;padding:13px;border:1px solid var(--border);border-radius:10px;background:#fff;font-size:14px}
.alphabet{display:flex;flex-wrap:wrap;gap:6px;margin-top:18px}
.letter{padding:7px 9px;border:1px solid var(--border);background:#fff;color:var(--primary);border-radius:7px;cursor:pointer;font-weight:700}
.letter:hover,.letter.active{background:var(--primary);color:#fff}
.info{display:flex;justify-content:space-between;gap:15px;align-items:center;margin:22px 0 12px}
.count{font-weight:700}.status{color:var(--muted);font-size:13px}
.results{display:grid;gap:12px}
.card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:18px;box-shadow:0 4px 16px rgba(20,45,75,.05)}
.card-top{display:flex;justify-content:space-between;gap:15px}
.number{color:var(--muted);font-size:13px}
.card h3{margin:4px 0 12px;color:var(--primary);font-size:18px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px 20px}
.field{padding:9px 0;border-bottom:1px solid #edf0f3}
.label{display:block;color:var(--muted);font-size:12px;margin-bottom:3px}
.value{font-size:14px;white-space:pre-line}
.empty{text-align:center;padding:40px;color:var(--muted)}
footer{text-align:center;padding:30px;color:var(--muted);font-size:13px}
@media(max-width:700px){
  .logos{gap:10px;min-height:85px}.logo-item{width:82px;height:82px}.logo-item img{max-width:78px;max-height:78px}
  .small-title{font-size:10px}.main-title{font-size:15px}.site-title{font-size:21px}
  h1{font-size:23px}.search-row{flex-direction:column}.search-row button{height:48px}
  .filters{grid-template-columns:1fr}.grid{grid-template-columns:1fr}
}
</style>
</head>

    <div class="department-title">
      <div class="small-title">ДЕПАРТАМЕНТ АГЕНТСТВА РЕСПУБЛИКИ КАЗАХСТАН</div>
      <div class="main-title">ПО ДЕЛАМ ГОСУДАРСТВЕННОЙ СЛУЖБЫ<br>ПО АЛМАТИНСКОЙ ОБЛАСТИ</div>

    <div class="site-title">ВЕБ-ПОИСКОВИК</div>

<main>
  <section class="panel">
    <div class="search-row">
      <input id="search" type="search" placeholder="Введите организацию, район, марку, госномер, пользователя..." autocomplete="off">
      <button id="clear">Сбросить</button>
    </div>

    <div class="filters">
      <select id="region"><option value="">Все территории</option></select>
      <select id="org"><option value="">Все организации</option></select>
      <select id="car"><option value="">Все марки / модели</option></select>
    </div>

    <div id="alphabet" class="alphabet"></div>

    <div class="info">
      <div id="count" class="count">Загрузка базы...</div>
      <div id="status" class="status"></div>
    </div>

    <div id="results" class="results"></div>
  </section>
</main>

<footer>Поисковик работает непосредственно в браузере. Данные загружаются из файла database.csv.</footer>

<script>
const CSV_FILE = "poiskovik_baza.csv";
let rows = [];
let headers = [];
let activeLetter = "";

const search = document.getElementById("search");
const region = document.getElementById("region");
const org = document.getElementById("org");
const car = document.getElementById("car");
const results = document.getElementById("results");
const count = document.getElementById("count");
const status = document.getElementById("status");
const alphabet = document.getElementById("alphabet");

function parseCSV(text){
  text = text.replace(/^\uFEFF/, "");
  const out=[]; let row=[]; let cell=""; let quoted=false;
  for(let i=0;i<text.length;i++){
    const c=text[i], n=text[i+1];
    if(c === '"'){
      if(quoted && n === '"'){ cell+='"'; i++; }
      else quoted=!quoted;
    } else if(c === ',' && !quoted){
      row.push(cell); cell="";
    } else if((c === '\n' || c === '\r') && !quoted){
      if(c === '\r' && n === '\n') i++;
      row.push(cell); cell="";
      if(row.some(v=>v.trim()!=="")) out.push(row);
      row=[];
    } else cell+=c;
  }
  if(cell!=="" || row.length){row.push(cell); if(row.some(v=>v.trim()!=="")) out.push(row);}
  return out;
}

function clean(v){return (v ?? "").toString().trim();}
function norm(v){return clean(v).toLocaleLowerCase("ru-RU");}

function uniqueSorted(values){
  return [...new Set(values.map(clean).filter(Boolean))]
    .sort((a,b)=>a.localeCompare(b,"ru"));
}

function fillSelect(select, values){
  const first=select.options[0].outerHTML;
  select.innerHTML=first;
  uniqueSorted(values).forEach(v=>{
    const o=document.createElement("option");
    o.value=v; o.textContent=v;
    select.appendChild(o);
  });
}

function setupAlphabet(){
  const letters="АБВГДЕЁЖЗИЙКЛМНОПРСТУФХЦЧШЩЪЫЬЭЮЯ".split("");
  alphabet.innerHTML="";
  const all=document.createElement("button");
  all.className="letter active"; all.textContent="Все";
  all.onclick=()=>{activeLetter=""; setActiveLetter(all); render();}
  alphabet.appendChild(all);
  letters.forEach(l=>{
    const b=document.createElement("button");
    b.className="letter"; b.textContent=l;
    b.onclick=()=>{activeLetter=l; setActiveLetter(b); render();}
    alphabet.appendChild(b);
  });
}
function setActiveLetter(el){
  document.querySelectorAll(".letter").forEach(x=>x.classList.remove("active"));
  el.classList.add("active");
}

function valueOf(r, name){
  const idx=headers.indexOf(name);
  return idx>=0 ? clean(r[idx]) : "";
}

function render(){
  const q=norm(search.value);
  const rg=region.value, og=org.value, ca=car.value;

  let filtered=rows.filter(r=>{
    const text=r.map(norm).join(" ");
    const first=norm(valueOf(r, headers[1] || "" ) || valueOf(r, headers[2] || ""));
    if(q && !text.includes(q)) return false;
    if(rg && valueOf(r, headers[1])!==rg) return false;
    if(og && valueOf(r, headers[2])!==og) return false;
    if(ca && valueOf(r, headers[8])!==ca) return false;
    if(activeLetter){
      const searchable=(valueOf(r,headers[2]) || valueOf(r,headers[1]) || valueOf(r,headers[5]));
      if(!norm(searchable).startsWith(norm(activeLetter))) return false;
    }
    return true;
  });

  count.textContent=`Найдено записей: ${filtered.length}`;
  if(filtered.length===0){
    results.innerHTML='<div class="empty">По вашему запросу ничего не найдено.</div>';
    return;
  }

  // Чтобы страница не становилась слишком тяжёлой при показе всех записей:
  const shown=filtered.slice(0,300);
  results.innerHTML=shown.map(makeCard).join("");
  if(filtered.length>300){
    results.innerHTML += `<div class="empty">Показаны первые 300 записей из ${filtered.length}. Уточните поиск.</div>`;
  }
}

function makeCard(r){
  const num=valueOf(r,headers[0]);
  const place=valueOf(r,headers[1]);
  const organization=valueOf(r,headers[2]);
  const user=valueOf(r,headers[5]);
  const carName=valueOf(r,headers[8]);
  const plate=valueOf(r,headers[9]);

  const fields=[
    [headers[1],place],[headers[3],valueOf(r,headers[3])],
    [headers[4],valueOf(r,headers[4])],[headers[5],user],
    [headers[6],valueOf(r,headers[6])],[headers[7],valueOf(r,headers[7])],
    [headers[8],carName],[headers[9],plate],[headers[10],valueOf(r,headers[10])]
  ].filter(x=>x[1]);

  return `<article class="card">
    <div class="card-top">
      <div>
        <div class="number">№ ${escapeHtml(num || "—")}</div>
        <h3>${escapeHtml(organization || carName || "Запись базы")}</h3>
      </div>
    </div>
    <div class="grid">
      ${fields.map(([label,val])=>`
        <div class="field">
          <span class="label">${escapeHtml(label.replace(/\s+/g," ").trim())}</span>
          <span class="value">${escapeHtml(val)}</span>
        </div>`).join("")}
    </div>
  </article>`;
}

function escapeHtml(s){
  return clean(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
}

async function loadData(){
  try{
    const response=await fetch(CSV_FILE);
    if(!response.ok) throw new Error("Файл базы не найден");
    const text=await response.text();
    const parsed=parseCSV(text);
    headers=parsed.shift().map(clean);

    // Пропускаем служебные строки Excel: оставляем записи, где первый столбец — номер.
    rows=parsed.filter(r=>/^\d+$/.test(clean(r[0] || "")));

    fillSelect(region, rows.map(r=>valueOf(r,headers[1])));
    fillSelect(org, rows.map(r=>valueOf(r,headers[2])));
    fillSelect(car, rows.map(r=>valueOf(r,headers[8])));
    setupAlphabet();
    status.textContent=`Загружено из базы: ${rows.length}`;
    render();
  }catch(e){
    count.textContent="Не удалось загрузить базу";
    status.textContent=e.message;
    results.innerHTML=`<div class="empty">
      Проверьте, что рядом с index.html лежит файл <b>poiskovik_baza.csv</b>.<br><br>
      Если вы просто открыли index.html двойным щелчком, браузер может блокировать чтение CSV.
      После размещения сайта на GitHub Pages всё будет работать.
    </div>`;
  }
}

search.addEventListener("input",render);
region.addEventListener("change",render);
org.addEventListener("change",render);
car.addEventListener("change",render);
document.getElementById("clear").addEventListener("click",()=>{
  search.value=""; region.value=""; org.value=""; car.value="";
  activeLetter=""; setupAlphabet(); render();
});

loadData();
</script>
